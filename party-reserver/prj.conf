# GPIO is needed for the sender button.
CONFIG_GPIO=y

# Enable Zephyr networking and the ESP32 Wi-Fi driver.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# Logging through the USB serial console.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_WIFI_LOG_LEVEL_ERR=y

# Give the Wi-Fi driver sufficient memory.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# CUSTOM SETTINGS - EDIT BEFORE BUILD
CONFIG_BUTTON_SENDER=y
CONFIG_APP_ESPNOW_CHANNEL=1